let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'default'}); }
catch(e){support.textContent='WebGL konnte nicht gestartet werden: '+e.message;throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,1,0.1,1100);
camera.position.set(0,0,0);

const panoramaGeometry = new THREE.SphereGeometry(100,48,32);
panoramaGeometry.scale(-1,1,1);
const panoramaMaterial = new THREE.MeshBasicMaterial({color:0xffffff});
const panorama = new THREE.Mesh(panoramaGeometry, panoramaMaterial);

// Important: Three.js' equirectangular UV zero differs from the Marzipano yaw zero.
// Rotating the sphere -90° makes panorama center correspond to yaw = 0.
panorama.rotation.y = -Math.PI / 2;
scene.add(panorama);

const hotspotGroup = new THREE.Group();
scene.add(hotspotGroup);

const loader = new THREE.TextureLoader();
const textureCache = new Map();

function makeArrowTexture(color="#ffffff"){
  const c=document.createElement("canvas");
  c.width=256;c.height=256;
  const x=c.getContext("2d");
  x.clearRect(0,0,256,256);
  x.beginPath();
  x.arc(128,128,92,0,Math.PI*2);
  x.fillStyle="rgba(0,0,0,.48)";
  x.fill();
  x.lineWidth=10;
  x.strokeStyle=color;
  x.stroke();
  x.beginPath();
  x.moveTo(128,52); x.lineTo(198,132); x.lineTo(158,132);
  x.lineTo(158,194); x.lineTo(98,194); x.lineTo(98,132); x.lineTo(58,132);
  x.closePath();
  x.fillStyle=color;
  x.fill();
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const arrowTex = makeArrowTexture("#ffffff");
const arrowHoverTex = makeArrowTexture("#55ff88");

function sphericalPosition(yaw,pitch,r=7.5){
  const cp=Math.cos(pitch);
  return new THREE.Vector3(
    r*cp*Math.sin(yaw),
    r*Math.sin(pitch),
    -r*cp*Math.cos(yaw)
  );
}

function clearHotspots(){
  while(hotspotGroup.children.length) hotspotGroup.remove(hotspotGroup.children[0]);
}

function buildHotspots(){
  clearHotspots();
  const s=SCENES[currentSceneId];
  targets.textContent="Erreichbar: "+s.links.map(l=>SCENES[l.target]?.name || "?").join(" · ");
  for(const link of s.links){
    const mat=new THREE.SpriteMaterial({map:arrowTex,transparent:true,depthTest:false,depthWrite:false});
    const sprite=new THREE.Sprite(mat);
    const corrected=corrections[currentSceneId+'|'+link.target];
    sprite.position.copy(sphericalPosition(corrected?.yaw??link.yaw,corrected?.pitch??-0.58));
    sprite.scale.set(1.15,1.15,1.15);
    sprite.userData.target=link.target;
    hotspotGroup.add(sprite);
  }
}

async function getTexture(url){
  if(textureCache.has(url)) return textureCache.get(url);
  const t=await loader.loadAsync(url.replace(/^images\//,'vr-images/'));
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

async function switchScene(id){
  if(!SCENES[id]) return;
  const serial=++switchSerial;
  currentSceneId=id;
  const s=SCENES[id];
  sceneName.textContent=s.name;
  sceneSelect.value=id;
  support.textContent='Lade Panorama: '+s.name;
  const tex=await getTexture(s.file);
  if(serial!==switchSerial)return;
  const previous=panorama.material.map;
  panorama.material.map=tex;
  if(previous && previous!==tex)previous.dispose();
  panorama.material.color.set(0xffffff);
  panorama.material.needsUpdate=true;
  support.textContent='Panorama geladen: '+s.name;
  buildHotspots();
}

switchScene(currentSceneId).catch(err => {
  support.textContent = "Panorama konnte nicht geladen werden: " + (err?.message || SCENES[currentSceneId]?.file || "unbekannter Fehler");
  console.error("Panorama-Ladefehler", err);
});

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();

const raycaster=new THREE.Raycaster();
const tempMatrix=new THREE.Matrix4();
let hovered=null;

function setHovered(obj){
  if(hovered===obj) return;
  if(hovered) hovered.material.map=arrowTex;
  hovered=obj;
  if(hovered) hovered.material.map=arrowHoverTex;
}

function setupController(index){
  const controller=renderer.xr.getController(index);
  scene.add(controller);
  const lineGeom=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]);
  const line=new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:0x55ff88}));
  line.scale.z=8;
  controller.add(line);
  controller.addEventListener("select",()=>{
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
    const hits=raycaster.intersectObjects(hotspotGroup.children,false);
    if(hits.length) switchScene(hits[0].object.userData.target);
  });
  return controller;
}
const controllers=[setupController(0),setupController(1)];

const mouse=new THREE.Vector2();
let pointerStart=null;
let viewYaw=0, viewPitch=0;
canvas.addEventListener("pointerdown", e=>{ pointerStart={x:e.clientX,y:e.clientY,yaw:viewYaw,pitch:viewPitch}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove",e=>{ if(!pointerStart || renderer.xr.isPresenting) return; viewYaw=pointerStart.yaw+(e.clientX-pointerStart.x)*0.004; viewPitch=Math.max(-1.45,Math.min(1.45,pointerStart.pitch+(e.clientY-pointerStart.y)*0.004)); camera.rotation.order="YXZ"; camera.rotation.set(viewPitch,viewYaw,0); });
canvas.addEventListener("pointerup",(e)=>{ if(!pointerStart)return; const moved=Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y); pointerStart=null; if(moved>7)return;
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(hotspotGroup.children,false);
  if(hits.length) switchScene(hits[0].object.userData.target);
});

let vrButton;
if(navigator.xr){
  try{
    const ok=await navigator.xr.isSessionSupported("immersive-vr");
    if(ok){
      support.textContent="Immersive VR wird unterstützt.";
      vrStart.disabled=false;
      vrButton=VRButton.createButton(renderer,{optionalFeatures:["local-floor","bounded-floor"]});
      vrButton.style.position="fixed";vrButton.style.bottom="15px";vrButton.style.right="15px";
      document.body.appendChild(vrButton);
      vrStart.style.display="none";
    } else support.textContent="Dieser Browser meldet keine Unterstützung für immersive VR.";
  } catch(e) { support.textContent="WebXR-Prüfung fehlgeschlagen: "+e.message; }
} else support.textContent="WebXR ist in diesem Browser nicht verfügbar (Panorama funktioniert trotzdem).";

renderer.xr.addEventListener("sessionstart",()=>document.body.classList.add("invr"));
renderer.xr.addEventListener("sessionend",()=>document.body.classList.remove("invr"));

renderer.setAnimationLoop(()=>{
  if(renderer.xr.isPresenting){
    let best=null;
    for(const controller of controllers){
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
      const hits=raycaster.intersectObjects(hotspotGroup.children,false);
      if(hits.length){best=hits[0].object;break;}
    }
    setHovered(best);
  }
  renderer.render(scene,camera);
});
</script>
<script>
window.addEventListener('error', e => {
  const status=document.getElementById('support');
  if(status && status.textContent.includes('WebXR wird geprüft')) status.textContent='JavaScript-Fehler: '+e.message;
});
window.addEventListener('unhandledrejection', e => {
  const status=document.getElementById('support');
  if(status) status.textContent='Fehler: '+String(e.reason?.message || e.reason);
});
</script>
</body>
</html>
