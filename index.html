<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Virtueller Schulrundgang</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;color:#fff;font-family:system-ui,Arial,sans-serif}#pano{position:absolute;inset:0;background:#111820}#toolbar{position:absolute;z-index:20;top:14px;left:14px;max-width:min(385px,calc(100vw - 28px));padding:16px;background:rgba(17,24,34,.93);border:1px solid #ffffff24;border-radius:16px;box-shadow:0 8px 32px #0006}h1{font-size:19px;margin:0 0 4px}#current{font-size:14px;color:#d0e4ed;margin:0 0 13px}label{display:block;font-size:12px;color:#d5e2e9;margin:8px 0 4px}select,button{font:inherit}select{width:100%;padding:9px;background:#f7fafb;color:#14202c;border:0;border-radius:8px}#row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 12px;background:#e7f2f6;color:#10242e;cursor:pointer;font-weight:600}button.primary{background:#59d4a0;color:#06281c}button:hover{filter:brightness(.94)}#status{font-size:12px;line-height:1.5;color:#e5e7eb;margin:10px 0 0}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:20px;background:#15212dcc;font-size:13px;white-space:nowrap;z-index:9}#collapse{position:absolute;right:12px;top:12px;padding:4px 9px}#toolbar.collapsed{padding:13px 45px 13px 14px}#toolbar.collapsed #content{display:none}#toolbar.collapsed h1{margin:0;font-size:15px}.arrow{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid #ffffffd0;border-radius:50%;background:#0d2635d9;color:white;cursor:pointer;box-shadow:0 3px 14px #0008;transition:transform .15s,background .15s}.arrow:hover,.arrow:focus{background:#166a8a;transform:scale(1.12)}.arrow .symbol{font-size:31px;line-height:1;transform:rotate(0deg)}.arrow .tooltip{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);padding:7px 10px;background:#0d2635e8;border-radius:7px;white-space:nowrap;font-size:13px;pointer-events:none;opacity:0}.arrow:hover .tooltip,.arrow:focus .tooltip{opacity:1}.arrow.route{background:#067a49;border-color:#adffd1;box-shadow:0 0 0 5px #00ef7040,0 3px 14px #0008}#loading{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#111820;font-size:16px;pointer-events:none}#loading.hidden{display:none}@media(max-width:600px){#toolbar{top:8px;left:8px;padding:12px;max-width:calc(100vw - 16px)}#hint{font-size:11px;bottom:8px}h1{font-size:16px}.arrow{width:48px;height:48px}}
</style></head><body><div id="pano"></div><div id="loading">Panorama wird geladen …</div><section id="toolbar"><button id="collapse" aria-label="Menü ein- oder ausblenden">−</button><h1>Virtueller Schulrundgang</h1><div id="content"><p id="current">Haupteingang</p><label for="floor">Bereich</label><select id="floor"><option value="all">Alle Bereiche</option><option value="eg">Erdgeschoss</option><option value="1">1. Stock</option><option value="2">2. Stock</option><option value="3">3. Stock</option><option value="k">Keller</option><option value="r">Fachräume und weitere Räume</option></select><label for="sceneSelect">Standort auswählen</label><select id="sceneSelect"></select><label for="destination">Weg zu einem Ziel finden</label><select id="destination"><option value="">Ziel auswählen …</option></select><div id="row"><button class="primary" id="route">Route anzeigen</button><button id="stop">Route beenden</button><button id="full">Vollbild</button><button id="editArrows">Pfeile korrigieren</button><button id="exportArrows">Korrekturen exportieren</button><button id="vrmode" title="Experimenteller immersiver WebXR-Modus">VR-Brille</button></div><p id="status" aria-live="polite">Pfeile anklicken, um zum nächsten Standort zu gelangen. Im Korrekturmodus: Pfeil wählen, dann an die richtige Stelle im Bild klicken.</p></div></section><div id="hint">Mit Maus oder Finger umsehen · Pfeile zum Weitergehen</div><script>document.getElementById("vrmode").addEventListener("click",()=>location.href="vr.html");</script><script src="vendor/marzipano.js"></script><script src="scenes.js"></script><script src="tour.js"></script></body></html>
